name: cloudpulse
x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://cloudpulse:${POSTGRES_PASSWORD}@timescaledb:5432/cloudpulse
    SYNC_DATABASE_URL: postgresql+psycopg://cloudpulse:${POSTGRES_PASSWORD}@timescaledb:5432/cloudpulse
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    OTLP_ENDPOINT: http://otel-collector:4317
    CORS_ORIGINS: http://localhost:8080,http://localhost:3000
  depends_on:
    timescaledb: { condition: service_healthy }
    redis: { condition: service_healthy }
    qdrant: { condition: service_started }
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [backend]

services:
  # ---- edge ----
  gateway:
    image: nginx:1.27-alpine
    volumes: ["./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on: [api, frontend]
    networks: [edge, backend]
    restart: unless-stopped

  # ---- app ----
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 10
  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker -l info -c 4 -Q default,cnn,apply
  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat -l info
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}" }
    depends_on: [api]
    networks: [backend]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  # ---- data ----
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment: { POSTGRES_USER: cloudpulse, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: cloudpulse }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cloudpulse"], interval: 5s, retries: 20 }
    networks: [backend]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    networks: [backend]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]
    networks: [backend]
    restart: unless-stopped

  # ---- observability ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./deploy/otel/otel.yaml:/etc/otel.yaml:ro"]
    networks: [backend]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["127.0.0.1:16686:16686"]
    networks: [backend]
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]
  grafana:
    image: grafana/grafana:11.3.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${POSTGRES_PASSWORD}", GF_USERS_ALLOW_SIGN_UP: "false" }
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    networks: [backend]

networks:
  edge: {}
  backend: { internal: false }
volumes:
  pgdata:
  redisdata:
  qdrantdata:
